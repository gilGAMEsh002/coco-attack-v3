[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "coco-attack"
version = "0.1.0"
description = "CoCo-Attack DSPy rebuild: domain foundation and experiment tooling"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
dependencies = [
    "dspy>=3.3.1",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
coco-attack = "coco_attack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
coco_attack = [
    "method/implicit_then_literal/prompt_templates/*",
    "method/implicit_then_literal/prompt_templates/a/*",
    "method/implicit_then_literal/prompt_templates/b/*",
    "method/implicit_then_literal/prompt_templates/inducer/*",
    "method/implicit_then_literal/prompt_templates/shared/*",
]
